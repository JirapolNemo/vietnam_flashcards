<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Flashcard ภาษา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:'Sarabun',sans-serif;
    background:#fdf6ec;
    color:#2b2320;
    padding:24px;
  }
  h1{
    font-size:1.4rem;
    margin-bottom:4px;
  }
  p.sub{
    color:#8a7f76;
    margin-top:0;
    margin-bottom:28px;
    font-size:0.9rem;
  }
  .cards{
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
    max-width:360px;
  }
  a.card{
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
    color:inherit;
    background:#fff;
    border:1px solid #e7ddd0;
    border-radius:16px;
    padding:18px 20px;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
    transition:transform .15s;
  }
  a.card:active{ transform:scale(0.98); }
  a.card .flag{
    font-size:32px;
  }
  a.card .label b{
    display:block;
    font-size:1.05rem;
  }
  a.card .label span{
    font-size:0.8rem;
    color:#8a7f76;
  }
  footer{
    margin-top:32px;
    font-size:0.72rem;
    color:#8a7f76;
  }
</style>
</head>
<body>
  <h1>Flashcard ภาษา 📚</h1>
  <p class="sub">เลือกชุดที่จะเปิดดู</p>
  <div class="cards">
    <a class="card" href="vietnamese/">
      <div class="flag">🇻🇳</div>
      <div class="label">
        <b>TIẾNG VIỆT</b>
        <span>Flashcard ออกเสียงเวียดนาม</span>
      </div>
    </a>
    <a class="card" href="chinese/">
      <div class="flag">🇨🇳</div>
      <div class="label">
        <b>拼音 PĪNYĪN</b>
        <span>Flashcard พินอินจีน</span>
      </div>
    </a>
  </div>
  <footer>อัปเดตล่าสุดตามที่แก้ในแต่ละโฟลเดอร์</footer>
</body>
</html>
